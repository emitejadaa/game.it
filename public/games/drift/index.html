<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Drift Neon · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script src="/sdk/gameit.js"></script>
  </head>
  <body>
    <canvas id="c"></canvas>

    <!-- HUD: uno por jugador (en pantalla dividida hay dos) -->
    <template id="hud-tpl">
      <div class="pv">
        <div class="top">
          <div class="box"><small data-t="lap"></small><b class="h-lap">1/3</b></div>
          <div class="box c"><small class="h-time-l" data-t="time"></small><b class="h-time">0:00.00</b></div>
          <div class="box pos"><small data-t="pos"></small><b class="h-pos">1°</b></div>
          <div class="box c pts" hidden><small data-t="driftPts"></small><b class="h-pts">0</b></div>
        </div>
        <div class="split"></div>
        <div class="warn" data-t="wrongWay"></div>
        <div class="combo"><b class="c-pts">0</b><span class="c-mult">DRIFT ×1</span><em class="c-near" data-t="near"></em></div>
        <div class="pop"></div>
        <div class="nitro"><small>NITRO</small><div><i></i></div></div>
        <div class="speed">
          <svg viewBox="0 0 100 100">
            <path d="M18 78 A40 40 0 1 1 82 78" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6" stroke-linecap="round" />
            <path class="gauge" d="M18 78 A40 40 0 1 1 82 78" fill="none" stroke="url(#gg)" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" />
          </svg>
          <b><span class="h-speed">0</span><small>KM/H</small></b>
        </div>
      </div>
    </template>
    <svg width="0" height="0" style="position: absolute">
      <defs><linearGradient id="gg"><stop offset="0" stop-color="#00f0ff" /><stop offset="1" stop-color="#ff2bd6" /></linearGradient></defs>
    </svg>
    <div class="hud" id="hud" hidden>
      <canvas class="minimap" id="mini"></canvas>
      <div class="board" id="board"></div>
      <button class="hbtn" id="b-cam" aria-label="cámara"><svg viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z" /><circle cx="12" cy="13" r="4" /></svg></button>
      <button class="hbtn" id="b-pause" aria-label="pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg></button>
    </div>
    <div class="lights" id="lights"><i></i><i></i><i></i><i></i></div>

    <div class="pad l" id="pad-l" hidden>
      <button data-k="left" aria-label="izquierda"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>
      <button data-k="right" aria-label="derecha"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></button>
    </div>
    <div class="pad r" id="pad-r" hidden>
      <div class="col">
        <button class="small" data-k="boost">NITRO</button>
        <button class="small" data-k="brake" data-t="brakeBtn"></button>
      </div>
      <button class="drift-btn" data-k="hand">DRIFT</button>
    </div>

    <section class="screen on" id="s-home">
      <div class="card">
        <div class="logo"><span>DRIFT</span><em>NEON</em></div>
        <p class="sub" data-t="tagline"></p>
        <div class="modes">
          <button class="mode" data-mode="race"><b data-t="race"></b><small data-t="raceSub"></small></button>
          <button class="mode" data-mode="trial"><b data-t="trial"></b><small data-t="trialSub"></small></button>
          <button class="mode" data-mode="drift"><b data-t="driftMode"></b><small data-t="driftSub"></small></button>
          <button class="mode" data-mode="local" id="mode-local"><b data-t="local"></b><small data-t="localSub"></small></button>
          <button class="mode" data-mode="online"><b data-t="online"></b><small data-t="onlineSub"></small></button>
        </div>
        <p class="keys" id="keys-hint"></p>
      </div>
    </section>

    <section class="screen" id="s-setup">
      <div class="card wide">
        <h2 class="orb title" id="setup-title"></h2>
        <div class="tracks" id="tracks"></div>
        <div class="tinfo" id="tinfo"></div>
        <div class="opts">
          <div class="opt" id="o-laps"><span class="lbl" data-t="laps"></span><div class="seg" data-o="laps"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button></div></div>
          <div class="opt" id="o-rivals"><span class="lbl" data-t="rivals"></span><div class="seg" data-o="rivals"><button data-v="0">0</button><button data-v="1">1</button><button data-v="3">3</button><button data-v="5">5</button></div></div>
          <div class="opt" id="o-level"><span class="lbl" data-t="level"></span><div class="seg" data-o="level"><button data-v="1" data-t="lv1"></button><button data-v="2" data-t="lv2"></button><button data-v="3" data-t="lv3"></button></div></div>
          <div class="opt" id="o-time"><span class="lbl" data-t="duration"></span><div class="seg" data-o="time"><button data-v="60">60 s</button><button data-v="90">90 s</button><button data-v="120">120 s</button></div></div>
        </div>
        <p class="sub small" id="setup-note"></p>
        <button class="go" id="setup-go" data-t="go"></button>
        <button class="link" data-back data-t="back"></button>
      </div>
    </section>

    <section class="screen" id="s-online">
      <div class="card">
        <h2 class="orb title" data-t="online"></h2>
        <input class="field" id="on-name" maxlength="16" autocomplete="off" />
        <button class="go" id="on-create" data-t="create"></button>
        <div class="row"><input class="field code-in" id="on-code" maxlength="5" autocomplete="off" placeholder="ABCDE" /><button class="go alt" id="on-join" data-t="join"></button></div>
        <p class="status" id="on-status"></p>
        <button class="link" data-back data-t="back"></button>
      </div>
    </section>

    <section class="screen" id="s-lobby">
      <div class="card wide">
        <span class="lbl center" data-t="shareCode"></span>
        <div class="code" id="lobby-code">-----</div>
        <button class="go alt" id="lobby-share" data-t="copyLink"></button>
        <ul class="plist" id="lobby-players"></ul>
        <div class="tracks" id="lobby-tracks"></div>
        <div class="tinfo" id="lobby-tinfo"></div>
        <div class="opt" id="lobby-laps-o"><span class="lbl" data-t="laps"></span><div class="seg" id="lobby-laps"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button></div></div>
        <button class="go" id="lobby-start" data-t="start"></button>
        <p class="status" id="lobby-status"></p>
        <button class="link" id="lobby-leave" data-t="leave"></button>
      </div>
    </section>

    <section class="screen" id="s-pause">
      <div class="card">
        <h2 class="orb title" data-t="paused"></h2>
        <button class="go" id="p-resume" data-t="resume"></button>
        <button class="go alt" id="p-restart" data-t="restart"></button>
        <button class="link" id="p-quit" data-t="menu"></button>
      </div>
    </section>

    <section class="screen" id="s-results">
      <div class="card">
        <h2 class="orb title" id="res-title"></h2>
        <div class="big" id="res-big"></div>
        <p class="sub" id="res-sub"></p>
        <div class="stats" id="res-stats"></div>
        <ul class="res" id="res-list"></ul>
        <button class="go" id="res-again" data-t="again"></button>
        <button class="go alt" id="res-reward" hidden></button>
        <div class="row2"><button class="link" id="res-setup" data-t="change"></button><button class="link" id="res-menu" data-t="menu"></button></div>
      </div>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
