<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Ameba · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script src="/sdk/gameit.js"></script>
  </head>
  <body>
    <canvas id="cv"></canvas>

    <!-- ============ HUD ============ -->
    <div class="hud" id="hud" hidden>
      <div class="lb" id="lb"><h3 data-t="top"></h3><ol id="lb-list"></ol></div>
      <div class="score"><small data-t="mass"></small><b id="mass">0</b><span id="rank"></span></div>
      <canvas class="mini" id="mini" width="140" height="140"></canvas>
      <button class="room-chip" id="room-chip" hidden></button>
      <button class="hud-btn" id="btn-menu" aria-label="Pausa"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" /></svg></button>
      <div class="touch" id="touch" hidden>
        <button class="tbtn eject" id="t-eject" aria-label="Expulsar"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4" /><path d="M14 12h7M18 9l3 3-3 3" /></svg></button>
        <button class="tbtn split" id="t-split" aria-label="Dividir"><svg viewBox="0 0 24 24"><circle cx="7.5" cy="12" r="4.5" /><circle cx="17" cy="12" r="4.5" /></svg></button>
      </div>
      <div class="stick" id="stick" hidden><i id="knob"></i></div>
      <p class="hint" id="hint"></p>
      <ul class="feed" id="feed"></ul>
    </div>

    <!-- ============ Inicio ============ -->
    <section class="screen on" id="s-home">
      <div class="panel">
        <div class="logo" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1 data-t="title"></h1>
        <p class="sub" data-t="tagline"></p>
        <input class="field" id="name" maxlength="16" autocomplete="off" />
        <div class="colors" id="colors" role="radiogroup"></div>
        <button class="btn primary big" id="go-online"><span data-t="playOnline"></span><small data-t="playOnlineSub"></small></button>
        <div class="row">
          <button class="btn" id="go-solo"><span data-t="solo"></span><small data-t="soloSub"></small></button>
          <button class="btn" id="go-private"><span data-t="private"></span><small data-t="privateSub"></small></button>
        </div>
        <p class="keys" id="keys"></p>
        <p class="status" id="home-status"></p>
      </div>
    </section>

    <!-- ============ Sala privada ============ -->
    <section class="screen" id="s-private">
      <div class="panel">
        <h2 data-t="private"></h2>
        <p class="sub" data-t="privateInfo"></p>
        <button class="btn primary" id="pv-create" data-t="createRoom"></button>
        <form class="row" id="pv-join" autocomplete="off"><input class="field code" id="pv-code" maxlength="5" placeholder="ABCDE" /><button class="btn" data-t="join"></button></form>
        <p class="status" id="pv-status"></p>
        <button class="back" data-go="home" data-t="back"></button>
      </div>
    </section>

    <!-- ============ Pausa ============ -->
    <section class="screen" id="s-pause">
      <div class="panel">
        <h2 id="pause-title" data-t="paused"></h2>
        <p class="sub" id="pause-sub"></p>
        <button class="btn primary" id="pz-resume" data-t="resume"></button>
        <button class="btn" id="pz-share" hidden data-t="copyLink"></button>
        <button class="btn ghost" id="pz-quit" data-t="quit"></button>
      </div>
    </section>

    <!-- ============ Muerte ============ -->
    <section class="screen" id="s-dead">
      <div class="panel">
        <p class="kicker" data-t="eaten"></p>
        <h2 id="dead-title"></h2>
        <div class="stats" id="dead-stats"></div>
        <button class="btn reward" id="dead-revive" hidden></button>
        <button class="btn primary" id="dead-again" data-t="again"></button>
        <button class="btn ghost" id="dead-menu" data-t="menu"></button>
      </div>
    </section>

    <div class="toast" id="toast"></div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
