<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Pac-Man · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="/sdk/gameit.js"></script>
    <style>
      :root {
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --pac: #ffe600;
      }
      :root[data-gi-theme='light'] {
        --pac: #e3a400;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--gi-bg);
        color: var(--gi-fg);
        font: 500 13px/1.4 'JetBrains Mono', ui-monospace, monospace;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }

      /* ---------- HUD ---------- */
      .hud {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 4vw, 34px);
        padding: 12px 110px 4px;
        min-height: 54px;
      }
      @media (max-width: 640px) {
        .hud {
          padding: 52px 12px 2px;
        }
      }
      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.15;
      }
      .stat small {
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--gi-mute);
      }
      .stat b {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }
      #score {
        color: var(--gi-accent);
      }
      #lives {
        display: flex;
        gap: 5px;
        height: 22px;
        align-items: center;
      }
      #lives i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: conic-gradient(from 120deg, transparent 0 60deg, var(--pac) 60deg);
        transform: rotate(-30deg);
      }
      .hud .pause {
        width: 30px;
        height: 30px;
        border: 1px solid var(--gi-line);
        border-radius: 9px;
        display: grid;
        place-items: center;
        transition:
          transform 0.4s var(--ease),
          border-color 0.2s,
          color 0.2s;
      }
      .hud .pause:hover {
        border-color: var(--gi-accent);
        color: var(--gi-accent);
        transform: translateY(-2px);
      }
      .hud .pause svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }

      /* ---------- Escenario ---------- */
      .area {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #stage {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        margin: 6px 12px 14px;
      }
      canvas {
        display: block;
      }

      /* ---------- Cruceta táctil ---------- */
      .dpad {
        display: none;
        flex: none;
        grid-template-columns: repeat(3, 60px);
        grid-template-rows: repeat(3, 52px);
        gap: 6px;
        justify-content: center;
        padding: 0 0 max(18px, env(safe-area-inset-bottom));
      }
      body.touch .dpad {
        display: grid;
      }
      .dpad button {
        border: 1px solid var(--gi-line);
        border-radius: 14px;
        display: grid;
        place-items: center;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .dpad button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dpad button.hit {
        animation: hit 0.35s var(--ease);
      }
      @keyframes hit {
        30% {
          background: color-mix(in oklab, var(--gi-accent) 25%, transparent);
          border-color: var(--gi-accent);
          transform: scale(0.94);
        }
      }
      .dpad [data-d='up'] {
        grid-area: 1 / 2;
      }
      .dpad [data-d='left'] {
        grid-area: 2 / 1;
      }
      .dpad [data-d='right'] {
        grid-area: 2 / 3;
      }
      .dpad [data-d='down'] {
        grid-area: 3 / 2;
      }

      /* ---------- Pantallas (inicio, pausa, fin) ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 16px;
        background: color-mix(in oklab, var(--gi-bg) 76%, transparent);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.4s var(--ease),
          visibility 0s linear 0.4s;
      }
      .overlay.on {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s var(--ease);
      }
      .panel {
        text-align: center;
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 30px clamp(20px, 5vw, 40px);
        border: 1px solid var(--gi-line);
        border-radius: 18px;
        background: var(--gi-bg);
        max-width: 420px;
        transform: translateY(10px) scale(0.97);
        transition: transform 0.5s var(--ease);
      }
      .overlay.on .panel {
        transform: none;
      }
      .overlay[data-state='intro'] .panel {
        border: 0;
        background: transparent;
      }
      .logo {
        font-size: clamp(40px, 10vw, 72px);
        font-weight: 700;
        letter-spacing: -0.04em;
        color: var(--pac);
      }
      :root[data-gi-glow='on'] .logo {
        text-shadow: 0 0 28px color-mix(in oklab, var(--pac) 55%, transparent);
      }
      h2 {
        font-size: 26px;
        letter-spacing: 0.04em;
        color: var(--gi-accent);
      }
      .blink {
        font-size: 13px;
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      .hint {
        font-size: 11px;
        color: var(--gi-mute);
      }
      kbd {
        font: inherit;
        padding: 2px 6px;
        border: 1px solid var(--gi-line);
        border-radius: 5px;
      }
      .big {
        font-size: 14px;
      }
      .big b {
        font-size: 22px;
        color: var(--gi-accent);
        margin-left: 6px;
      }
      .sub {
        font-size: 11px;
        color: var(--gi-mute);
        margin-top: -8px;
      }
      .btns {
        display: grid;
        gap: 8px;
        width: 100%;
        min-width: 220px;
        margin-top: 4px;
      }
      .btns button {
        height: 40px;
        border: 1px solid var(--gi-line);
        border-radius: 11px;
        transition:
          transform 0.45s var(--ease),
          border-color 0.2s,
          color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }
      .btns button:hover,
      .btns button:focus-visible {
        outline: none;
        border-color: var(--gi-accent);
        color: var(--gi-accent);
        transform: translateY(-2px);
      }
      .btns button.primary {
        background: var(--gi-accent);
        border-color: var(--gi-accent);
        color: var(--gi-bg);
      }
      .btns button.primary:hover,
      .btns button.primary:focus-visible {
        color: var(--gi-bg);
      }
      :root[data-gi-glow='on'] .btns button.primary {
        box-shadow: 0 0 18px -4px var(--gi-accent);
      }
      .btns button:active {
        transform: scale(0.97);
      }
      :root[data-gi-motion='reduced'] * {
        animation: none !important;
        transition-duration: 1ms !important;
      }
    </style>
  </head>
  <body>
    <header class="hud">
      <div class="stat"><small data-t="score">score</small><b id="score">00000</b></div>
      <div class="stat"><small data-t="best">best</small><b id="best">00000</b></div>
      <div class="stat"><small data-t="level">lvl</small><b id="level">1</b></div>
      <div class="stat"><small>♥</small><span id="lives"></span></div>
      <button class="pause" id="btn-pause" aria-label="pausa"><svg viewBox="0 0 12 12"><rect x="2" y="1" width="3" height="10" rx="1" /><rect x="7" y="1" width="3" height="10" rx="1" /></svg></button>
    </header>
    <div class="area">
      <div id="stage"><canvas id="game"></canvas></div>
      <div class="dpad">
        <button data-d="up" aria-label="arriba"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></svg></button>
        <button data-d="left" aria-label="izquierda"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
        <button data-d="right" aria-label="derecha"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
        <button data-d="down" aria-label="abajo"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg></button>
      </div>
    </div>
    <div class="overlay" id="overlay"></div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
