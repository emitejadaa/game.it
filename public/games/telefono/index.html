<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Teléfono Loco · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script src="/sdk/gameit.js"></script>
  </head>
  <body>
    <!-- partida -->
    <main id="app" hidden>
      <header class="bar">
        <div class="timer" id="timer"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" /><circle class="t-arc" id="t-arc" cx="20" cy="20" r="17" pathLength="100" /></svg><b id="t-num"></b></div>
        <div class="phase"><small id="p-step"></small><b id="p-title"></b></div>
        <button class="bx" id="b-exit" aria-label="salir"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" /></svg></button>
      </header>

      <!-- escribir / describir -->
      <section class="stage" id="st-text" hidden>
        <div class="seen" id="seen-draw" hidden><canvas id="seen-cv" width="1000" height="750"></canvas></div>
        <div class="card write">
          <div class="art" id="write-art"></div>
          <h2 class="hand" id="write-q"></h2>
          <form class="say" id="say">
            <input id="txt" maxlength="90" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
            <button type="button" class="dice" id="b-dice" aria-label="al azar">🎲</button>
          </form>
          <button class="btn" id="b-done-t"></button>
        </div>
      </section>

      <!-- dibujar -->
      <section class="stage draw" id="st-draw" hidden>
        <div class="prompt"><small id="draw-lbl"></small><b class="hand" id="draw-txt"></b></div>
        <div class="paper" id="paper"><canvas id="cv" width="1000" height="750"></canvas></div>
        <div class="tools" id="tools">
          <div class="pal" id="pal"></div>
          <div class="sizes" id="sizes"></div>
          <div class="tbtns">
            <button class="tb" data-tool="brush" aria-label="pincel"><svg viewBox="0 0 24 24"><path d="M4 20c2 0 4-1 4-3a3 3 0 0 0-3-3c-2 0-2 3-1 6zM7 14 18 3l3 3-11 11" /></svg></button>
            <button class="tb" data-tool="eraser" aria-label="goma"><svg viewBox="0 0 24 24"><path d="M3 16l9-9 6 6-7 7H7zM11 20h10" /></svg></button>
            <button class="tb" data-tool="fill" aria-label="balde"><svg viewBox="0 0 24 24"><path d="M5 11l6-6 7 7-6 6zM18 15s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4zM11 5 8 2" /></svg></button>
            <button class="tb" id="b-undo" aria-label="deshacer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" /></svg></button>
            <button class="tb" id="b-clear" aria-label="borrar todo"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg></button>
          </div>
          <button class="btn small" id="b-done-d"></button>
        </div>
      </section>

      <!-- revelación -->
      <section class="stage reveal" id="st-reveal" hidden>
        <div class="album-head"><b class="hand" id="al-title"></b><small id="al-count"></small></div>
        <div class="feed" id="feed"></div>
        <div class="rev-bar">
          <div class="reacts" id="reacts"></div>
          <button class="btn" id="b-next"></button>
          <p class="note" id="rev-note"></p>
        </div>
      </section>

      <!-- estado de los jugadores -->
      <footer class="who" id="who"></footer>
      <div class="waiting" id="waiting" hidden><div class="card"><div class="phone"></div><h3 id="wait-t"></h3><p id="wait-n"></p><button class="btn alt" id="b-edit"></button></div></div>
    </main>
    <div class="floaters" id="floaters"></div>

    <section class="screen on" id="s-home">
      <div class="panel">
        <div class="logo"><div class="cord"></div><h1><span data-t="title1"></span><em data-t="title2"></em></h1></div>
        <p class="sub" data-t="tagline"></p>
        <input class="field" id="name" maxlength="16" autocomplete="off" />
        <button class="btn" id="b-quick" data-t="quick"></button>
        <button class="btn alt" id="b-create" data-t="createPrivate"></button>
        <div class="row"><input class="field code-in" id="code" maxlength="5" autocomplete="off" placeholder="ABCDE" /><button class="btn alt" id="b-join" data-t="join"></button></div>
        <p class="err" id="h-status"></p>
        <div class="rooms"><span class="lbl" data-t="publicRooms"></span><ul id="rooms"></ul></div>
        <button class="link" data-go="rules" data-t="howTo"></button>
      </div>
    </section>

    <section class="screen" id="s-rules">
      <div class="panel">
        <h2 data-t="howTo"></h2>
        <ol class="steps" id="rules-body"></ol>
        <button class="btn" data-back data-t="back"></button>
      </div>
    </section>

    <section class="screen" id="s-lobby">
      <div class="panel wide">
        <span class="lbl center" data-t="shareCode"></span>
        <div class="code" id="l-code">-----</div>
        <button class="btn alt" id="l-share" data-t="copyLink"></button>
        <ul class="plist" id="l-players"></ul>
        <div id="l-host">
          <div class="grid2">
            <div class="opt"><span class="lbl" data-t="startMode"></span><div class="seg" data-l="start"><button data-v="write" data-t="startWrite"></button><button data-v="random" data-t="startRandom"></button></div></div>
            <div class="opt"><span class="lbl" data-t="lang"></span><div class="seg" data-l="lang"><button data-v="es">Español</button><button data-v="en">English</button></div></div>
            <div class="opt"><span class="lbl" data-t="drawTime"></span><div class="seg" data-l="drawTime"><button data-v="45">45</button><button data-v="60">60</button><button data-v="90">90</button><button data-v="120">120</button><button data-v="180">180</button></div></div>
            <div class="opt"><span class="lbl" data-t="writeTime"></span><div class="seg" data-l="writeTime"><button data-v="20">20</button><button data-v="30">30</button><button data-v="40">40</button><button data-v="60">60</button></div></div>
            <div class="opt"><span class="lbl" data-t="chain"></span><div class="seg" data-l="chain"><button data-v="0" data-t="chainAll"></button><button data-v="4">4</button><button data-v="6">6</button><button data-v="8">8</button></div></div>
            <div class="opt"><span class="lbl" data-t="revealMode"></span><div class="seg" data-l="reveal"><button data-v="manual" data-t="revealManual"></button><button data-v="auto" data-t="revealAuto"></button></div></div>
          </div>
          <div class="opt"><span class="lbl" data-t="visibility"></span><div class="seg" data-l="public"><button data-v="false" data-t="private"></button><button data-v="true" data-t="public"></button></div></div>
        </div>
        <p class="note" id="l-info"></p>
        <button class="btn" id="l-start" data-t="start"></button>
        <p class="err" id="l-status"></p>
        <button class="link" id="l-leave" data-t="leave"></button>
      </div>
    </section>

    <section class="screen dim" id="s-end">
      <div class="panel wide">
        <h2 class="hand big" data-t="theEnd"></h2>
        <p class="sub" data-t="endSub"></p>
        <div class="albums" id="e-albums"></div>
        <button class="btn" id="e-again" data-t="again"></button>
        <button class="btn alt" id="e-room" data-t="backRoom"></button>
        <p class="note" id="e-status"></p>
        <button class="link" id="e-leave" data-t="leave"></button>
      </div>
    </section>

    <section class="screen dim" id="s-album">
      <div class="panel wide viewer">
        <div class="album-head"><b class="hand" id="v-title"></b><small id="v-count"></small></div>
        <div class="feed" id="v-feed"></div>
        <div class="row2"><button class="btn alt" id="v-save" data-t="save"></button><button class="btn" id="v-back" data-t="back"></button></div>
      </div>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
