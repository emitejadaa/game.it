<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Stack · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&display=swap" rel="stylesheet" />
    <script src="/sdk/gameit.js"></script>
    <style>
      :root {
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: linear-gradient(180deg, var(--top, #1b1d3a), var(--bottom, #07070a));
        color: #fff;
        font: 500 14px/1.3 'JetBrains Mono', ui-monospace, monospace;
        transition: background 1.2s linear;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      .score {
        position: fixed;
        top: calc(60px + env(safe-area-inset-top));
        left: 0;
        right: 0;
        text-align: center;
        font-size: clamp(56px, 14vw, 110px);
        font-weight: 300;
        letter-spacing: -0.04em;
        pointer-events: none;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s var(--spring);
      }
      .score.bump {
        transform: scale(1.12);
      }
      .combo {
        position: fixed;
        top: calc(60px + env(safe-area-inset-top) + clamp(64px, 15vw, 118px));
        left: 0;
        right: 0;
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
      }
      .combo.show {
        animation: combo 1s var(--ease);
      }
      @keyframes combo {
        0% {
          opacity: 0;
          transform: translateY(10px) scale(0.8);
        }
        25% {
          opacity: 1;
          transform: none;
        }
        100% {
          opacity: 0;
          transform: translateY(-14px);
        }
      }
      .screen {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(12% + env(safe-area-inset-bottom));
        display: grid;
        justify-items: center;
        gap: 12px;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.5s var(--ease), transform 0.6s var(--spring);
      }
      .screen.on {
        opacity: 1;
        transform: none;
      }
      .screen h1 {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
      .screen p {
        opacity: 0.8;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .stats {
        display: flex;
        gap: 22px;
        font-size: 12px;
        opacity: 0.9;
      }
      .stats b {
        display: block;
        font-size: 22px;
      }
      :root[data-gi-motion='reduced'] * {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    </style>
  </head>
  <body>
    <div class="score" id="score">0</div>
    <div class="combo" id="combo"></div>
    <div class="screen on" id="start">
      <h1>STACK</h1>
      <p id="start-hint"></p>
    </div>
    <div class="screen" id="over">
      <div class="stats" id="stats"></div>
      <p id="over-hint"></p>
    </div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
