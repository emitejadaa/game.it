<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Sky Hop · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
    <script src="/sdk/gameit.js"></script>
    <style>
      /* Estética: cielo de papel recortado, colores pastel que cambian con la altura */
      :root { --ink: #2d2a4a; --card: rgba(255, 255, 255, 0.86); --accent: #ff7aa8; --accent2: #6bc6ff; --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease: cubic-bezier(0.22, 1, 0.36, 1); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      body { background: #9fd8ff; color: var(--ink); font: 800 16px/1.25 'Nunito', system-ui, sans-serif; }
      button, input { font: inherit; color: inherit; background: none; border: 0; }
      button { cursor: pointer; }
      [hidden] { display: none !important; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; }
      @media (max-width: 560px) { .hud { top: calc(54px + env(safe-area-inset-top)); } }
      .pill { padding: 6px 14px; border-radius: 99px; background: var(--card); box-shadow: 0 4px 0 rgba(45, 42, 74, 0.15); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .pill b { font-size: 20px; font-weight: 900; }
      .pill small { color: #7a7699; font-size: 12px; margin-left: 4px; }
      .power { position: fixed; top: calc(62px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: 120px; height: 8px; border-radius: 8px; background: rgba(255, 255, 255, 0.5); overflow: hidden; }
      @media (max-width: 560px) { .power { top: calc(104px + env(safe-area-inset-top)); } }
      .power i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
      .biome { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: clamp(30px, 8vw, 56px); font-weight: 900; color: #fff; text-shadow: 0 4px 0 rgba(45, 42, 74, 0.25); opacity: 0; pointer-events: none; white-space: nowrap; letter-spacing: 0.02em; }
      .biome.show { animation: biome 2.4s var(--ease); }
      @keyframes biome { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); } 20%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%); } }
      .count { position: fixed; inset: 0; display: grid; place-items: center; font-size: 110px; font-weight: 900; color: #fff; text-shadow: 0 6px 0 rgba(45, 42, 74, 0.25); pointer-events: none; }
      .count.pop { animation: cnt 0.9s var(--spring) forwards; }
      @keyframes cnt { 0% { transform: scale(0.3); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }
      .others { position: fixed; right: 12px; top: calc(60px + env(safe-area-inset-top)); display: grid; gap: 4px; pointer-events: none; font-size: 13px; }
      .others div { padding: 3px 10px; border-radius: 99px; background: var(--card); display: flex; gap: 6px; align-items: center; }
      .others i { width: 10px; height: 10px; border-radius: 50%; }
      .others .dead { opacity: 0.5; text-decoration: line-through; }

      .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 60px 16px 20px; overflow-y: auto; opacity: 0; visibility: hidden; transition: opacity 0.4s var(--ease), visibility 0s linear 0.4s; }
      .screen.on { opacity: 1; visibility: visible; transition: opacity 0.4s var(--ease); }
      .card { width: min(380px, 100%); padding: 24px 20px; border-radius: 28px; background: var(--card); box-shadow: 0 10px 0 rgba(45, 42, 74, 0.12), 0 30px 60px -30px rgba(45, 42, 74, 0.4); display: grid; gap: 12px; text-align: center; transform: translateY(20px) scale(0.95); transition: transform 0.55s var(--spring); backdrop-filter: blur(6px); }
      .screen.on .card { transform: none; }
      h1 { font-size: 54px; font-weight: 900; line-height: 0.95; color: var(--accent); letter-spacing: -0.02em; text-shadow: 0 4px 0 rgba(45, 42, 74, 0.12); }
      h1 span { color: var(--accent2); display: inline-block; animation: hop 1.4s var(--spring) infinite; }
      @keyframes hop { 0%, 100% { transform: none; } 40% { transform: translateY(-10px) rotate(-6deg); } }
      h2 { font-size: 30px; font-weight: 900; }
      .sub { color: #7a7699; font-weight: 700; }
      .btn { height: 56px; border-radius: 18px; background: var(--accent); color: #fff; font-size: 20px; font-weight: 900; box-shadow: 0 6px 0 #d95b8a; transition: transform 0.35s var(--spring), box-shadow 0.2s; }
      .btn.b { background: var(--accent2); box-shadow: 0 6px 0 #4a9fd6; }
      .btn.w { background: #fff; color: var(--ink); box-shadow: 0 6px 0 rgba(45, 42, 74, 0.15); }
      .btn:hover { transform: translateY(-3px); }
      .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
      .seg { display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: rgba(45, 42, 74, 0.08); }
      .seg button { flex: 1; padding: 8px; border-radius: 12px; font-weight: 800; color: #7a7699; transition: background 0.25s, color 0.2s; }
      .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 3px 0 rgba(45, 42, 74, 0.12); }
      .field { height: 50px; border-radius: 16px; padding: 0 16px; background: rgba(45, 42, 74, 0.07); font-size: 20px; font-weight: 800; outline: none; -webkit-user-select: text; user-select: text; }
      .field.code { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; }
      .row { display: flex; gap: 8px; }
      .row > .field { flex: 1; min-width: 0; }
      .status { min-height: 1.3em; color: #e0457b; font-weight: 800; font-size: 14px; }
      .code { font-size: 46px; font-weight: 900; letter-spacing: 0.16em; color: var(--accent2); }
      .plist { list-style: none; display: grid; gap: 6px; text-align: left; }
      .plist li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(45, 42, 74, 0.06); }
      .plist li i { width: 18px; height: 18px; border-radius: 50%; }
      .plist small { margin-left: auto; color: #7a7699; font-size: 13px; }
      .link { color: #7a7699; font-weight: 800; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stats div { padding: 10px 6px; border-radius: 16px; background: rgba(45, 42, 74, 0.06); }
      .stats b { display: block; font-size: 22px; font-weight: 900; }
      .stats small { font-size: 11px; color: #7a7699; }
      .big { font-size: 64px; font-weight: 900; color: var(--accent); line-height: 1; }
      .rank { list-style: none; display: grid; gap: 6px; text-align: left; }
      .rank li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(45, 42, 74, 0.06); animation: rowIn 0.5s var(--spring) both; }
      .rank li:nth-child(2) { animation-delay: 0.08s; } .rank li:nth-child(3) { animation-delay: 0.16s; } .rank li:nth-child(4) { animation-delay: 0.24s; }
      @keyframes rowIn { from { opacity: 0; transform: translateX(-20px); } }
      .rank b { margin-left: auto; }
      .hint { font-size: 13px; color: #7a7699; font-weight: 700; }
      :root[data-gi-motion='reduced'] * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="hud" id="hud" hidden><div class="pill"><b id="h-score">0</b><small>m</small></div><div class="pill"><small data-t="best"></small> <b id="h-best">0</b></div></div>
    <div class="power" id="power" hidden><i></i></div>
    <div class="others" id="others"></div>
    <div class="biome" id="biome"></div>
    <div class="count" id="count"></div>

    <section class="screen on" id="s-home">
      <div class="card">
        <h1>Sky <span>Hop</span></h1>
        <p class="sub" data-t="tagline"></p>
        <button class="btn" id="play-solo" data-t="solo"></button>
        <button class="btn b" data-go="online" data-t="online"></button>
        <div id="ctrl-box">
          <p class="hint" data-t="controls"></p>
          <div class="seg" id="ctrl"><button data-v="touch" class="on" data-t="touch"></button><button data-v="tilt" data-t="tilt"></button></div>
        </div>
        <p class="hint" id="hint-keys" data-t="keys"></p>
      </div>
    </section>

    <section class="screen" id="s-online">
      <div class="card">
        <h2 data-t="online"></h2>
        <p class="sub" data-t="onlineSub"></p>
        <input class="field" id="on-name" maxlength="16" autocomplete="off" />
        <button class="btn" id="on-create" data-t="create"></button>
        <div class="row"><input class="field code" id="on-code" maxlength="5" autocomplete="off" placeholder="ABCDE" /><button class="btn b" style="padding: 0 18px" id="on-join" data-t="join"></button></div>
        <p class="status" id="on-status"></p>
        <button class="link" data-go="home" data-t="back"></button>
      </div>
    </section>

    <section class="screen" id="s-lobby">
      <div class="card">
        <p class="sub" data-t="shareCode"></p>
        <div class="code" id="lobby-code">-----</div>
        <button class="btn w" id="lobby-share" data-t="copyLink"></button>
        <ul class="plist" id="lobby-players"></ul>
        <button class="btn" id="lobby-start" data-t="start"></button>
        <p class="status" id="lobby-status"></p>
        <button class="link" id="lobby-leave" data-t="leave"></button>
      </div>
    </section>

    <section class="screen" id="s-over">
      <div class="card">
        <h2 id="over-title"></h2>
        <div class="big" id="over-score">0</div>
        <p class="sub" id="over-best"></p>
        <div class="stats" id="over-stats"></div>
        <ul class="rank" id="over-rank"></ul>
        <button class="btn" id="over-again" data-t="again"></button>
        <button class="btn b" id="over-revive" hidden></button>
        <button class="link" id="over-menu" data-t="menu"></button>
      </div>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
