<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Garabato · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script src="/sdk/gameit.js"></script>
  </head>
  <body>
    <main id="app" hidden>
      <header class="bar">
        <div class="timer" id="timer"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" /><circle class="t-arc" id="t-arc" cx="20" cy="20" r="17" pathLength="100" /></svg><b id="t-num"></b></div>
        <div class="word" id="hint"></div>
        <div class="round" id="round"></div>
        <button class="bx" id="b-exit" aria-label="salir"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" /></svg></button>
      </header>
      <aside class="players" id="players"></aside>
      <section class="board">
        <div class="paper" id="paper">
          <canvas id="cv" width="1000" height="750"></canvas>
          <div class="over" id="over" hidden></div>
        </div>
        <div class="tools" id="tools" hidden>
          <div class="pal" id="pal"></div>
          <div class="sizes" id="sizes"></div>
          <div class="tbtns">
            <button class="tb" data-tool="brush" aria-label="pincel"><svg viewBox="0 0 24 24"><path d="M4 20c2 0 4-1 4-3a3 3 0 0 0-3-3c-2 0-2 3-1 6zM7 14 18 3l3 3-11 11" /></svg></button>
            <button class="tb" data-tool="eraser" aria-label="goma"><svg viewBox="0 0 24 24"><path d="M3 16l9-9 6 6-7 7H7zM11 20h10" /></svg></button>
            <button class="tb" data-tool="fill" aria-label="balde"><svg viewBox="0 0 24 24"><path d="M5 11l6-6 7 7-6 6zM18 15s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4zM11 5 8 2" /></svg></button>
            <button class="tb" id="b-undo" aria-label="deshacer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" /></svg></button>
            <button class="tb" id="b-clear" aria-label="borrar todo"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg></button>
          </div>
        </div>
      </section>
      <section class="chat">
        <div class="log" id="log"></div>
        <form class="say" id="say"><input id="msg" maxlength="80" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" /><button aria-label="enviar"><svg viewBox="0 0 24 24"><path d="M4 12h14M12 5l7 7-7 7" /></svg></button></form>
      </section>
    </main>

    <section class="screen on" id="s-home">
      <div class="panel">
        <div class="logo"><div class="doodle"></div><h1 data-t="title"></h1></div>
        <p class="sub" data-t="tagline"></p>
        <input class="field" id="name" maxlength="16" autocomplete="off" />
        <button class="btn" id="b-quick" data-t="quick"></button>
        <button class="btn alt" id="b-create" data-t="createPrivate"></button>
        <div class="row"><input class="field code-in" id="code" maxlength="5" autocomplete="off" placeholder="ABCDE" /><button class="btn alt" id="b-join" data-t="join"></button></div>
        <p class="err" id="h-status"></p>
        <div class="rooms"><span class="lbl" data-t="publicRooms"></span><ul id="rooms"></ul></div>
        <button class="link" data-go="rules" data-t="howTo"></button>
      </div>
    </section>

    <section class="screen" id="s-rules">
      <div class="panel">
        <h2 data-t="howTo"></h2>
        <div class="rules" id="rules-body"></div>
        <button class="btn" data-back data-t="back"></button>
      </div>
    </section>

    <section class="screen" id="s-lobby">
      <div class="panel wide">
        <span class="lbl center" data-t="shareCode"></span>
        <div class="code" id="l-code">-----</div>
        <button class="btn alt" id="l-share" data-t="copyLink"></button>
        <ul class="plist" id="l-players"></ul>
        <div id="l-host">
          <div class="grid2">
            <div class="opt"><span class="lbl" data-t="lang"></span><div class="seg" data-l="lang"><button data-v="es">Español</button><button data-v="en">English</button></div></div>
            <div class="opt"><span class="lbl" data-t="rounds"></span><div class="seg" data-l="rounds"><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></div>
            <div class="opt"><span class="lbl" data-t="time"></span><div class="seg" data-l="time"><button data-v="60">60</button><button data-v="80">80</button><button data-v="100">100</button><button data-v="120">120</button></div></div>
            <div class="opt"><span class="lbl" data-t="hints"></span><div class="seg" data-l="hints"><button data-v="1" data-t="yes"></button><button data-v="0" data-t="no"></button></div></div>
          </div>
          <div class="opt"><span class="lbl" data-t="visibility"></span><div class="seg" data-l="public"><button data-v="false" data-t="private"></button><button data-v="true" data-t="public"></button></div></div>
          <div class="opt"><span class="lbl" data-t="custom"></span><textarea class="field ta" id="l-custom" maxlength="1500" rows="2"></textarea><label class="chk"><input type="checkbox" id="l-only" /> <span data-t="onlyCustom"></span></label></div>
        </div>
        <p class="note" id="l-info"></p>
        <button class="btn" id="l-start" data-t="start"></button>
        <p class="err" id="l-status"></p>
        <button class="link" id="l-leave" data-t="leave"></button>
      </div>
    </section>

    <section class="screen dim" id="s-end">
      <div class="panel">
        <h2 data-t="podium"></h2>
        <div class="podium" id="podium"></div>
        <ul class="plist rank" id="rank"></ul>
        <button class="btn" id="e-again" data-t="again"></button>
        <p class="note" id="e-status"></p>
        <button class="link" id="e-leave" data-t="leave"></button>
      </div>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
