      <rect x="25" y="5.5" width="17" height="7" rx="2" fill="#e5edf2"/>
      <circle cx="13" cy="9" r="3.6" fill="#8ea3b2" stroke="#34495a"/><circle cx="49" cy="9" r="3.6" fill="#8ea3b2" stroke="#34495a"/><circle cx="58" cy="9" r="3.2" fill="#8ea3b2" stroke="#34495a"/>
      <path d="M52 8h6M52 10h6M61 8h5M61 10h5" stroke="#5f7686"/>
    </g>
    <!-- submarino hundiéndose -->
    <g transform="translate(108 112)">
      <path d="M8 4H44Q54 4 54 9Q54 14 44 14H8A5 5 0 0 1 8 4Z" fill="#3a3a38" stroke="#141312"/>
      <rect x="27" y="5.5" width="9" height="7" rx="3.5" fill="#433f3c"/>
    </g>
    <!-- marcas -->
    <g fill="#eef9ff"><circle cx="99" cy="27" r="2.6"/><circle cx="135" cy="81" r="2.6"/><circle cx="27" cy="117" r="2.6"/><circle cx="63" cy="153" r="2.6"/><circle cx="153" cy="45" r="2.6"/></g>
    <g fill="none" stroke="rgba(220,245,255,.3)"><circle cx="99" cy="27" r="6"/><circle cx="135" cy="81" r="6"/><circle cx="27" cy="117" r="6"/><circle cx="63" cy="153" r="6"/><circle cx="153" cy="45" r="6"/></g>
    <circle cx="117" cy="121" r="15" fill="url(#fuego)"/><circle cx="135" cy="121" r="13" fill="url(#fuego)"/>
    <path d="M114 122q2-9 4-12q2 5 4 12z M132 122q2-8 4-11q2 5 3 11z" fill="#ffe39a"/>
    <circle cx="66" cy="49" r="11" fill="url(#fuego)"/>
