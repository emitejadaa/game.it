  <!-- proyectil -->
  <path d="M292 190Q270 90 212 152" fill="none" stroke="rgba(255,220,160,.45)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>
  <circle cx="214" cy="150" r="4" fill="#fff1c8"/>
  <text x="40" y="30" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="rgba(255,181,71,.85)" transform="rotate(-90 40 30)" text-anchor="end">BATALLA NAVAL</text>
