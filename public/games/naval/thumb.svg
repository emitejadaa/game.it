    <rect width="180" height="180" fill="url(#grilla)"/>
    <g stroke="rgba(170,235,255,.18)" fill="none" stroke-width="1.2"><path d="M12 30q6-4 12 0t12 0"/><path d="M120 60q6-4 12 0t12 0"/><path d="M40 140q6-4 12 0t12 0"/><path d="M130 160q6-4 12 0t12 0"/></g>
    <!-- acorazado -->
