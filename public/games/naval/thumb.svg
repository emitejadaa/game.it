    <g stroke="#ffb547" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M128 136h-4v4M142 136h4v4M128 150h-4v-4M142 150h4v-4"/></g>
    <g stroke="rgba(255,181,71,.8)"><path d="M135 139v8M131 143h8"/></g>
