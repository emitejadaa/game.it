<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0b2a3d"/><stop offset="1" stop-color="#020b12"/></radialGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f4262"/><stop offset="1" stop-color="#082c45"/></linearGradient>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3d2dc"/><stop offset="1" stop-color="#7890a0"/></linearGradient>
    <radialGradient id="fuego"><stop offset="0" stop-color="#fff2c0"/><stop offset=".4" stop-color="#ffb547"/><stop offset="1" stop-color="#ff5a36" stop-opacity="0"/></radialGradient>
    <pattern id="grilla" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="rgba(150,225,255,.18)"/></pattern>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <g transform="translate(70 16)">
