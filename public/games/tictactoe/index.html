<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Tateti · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
    <script src="/sdk/gameit.js"></script>
    <style>
      /* Estética: cuaderno cuadriculado (claro) / pizarrón con tiza (oscuro) */
      :root {
        --paper: #fbf8f0;
        --grid: rgba(70, 130, 200, 0.18);
        --margin: rgba(220, 70, 70, 0.45);
        --ink: #2a2f45;
        --x: #1f4fbf;
        --o: #d83a3a;
        --hl: rgba(255, 221, 0, 0.55);
        --muted: #6d7089;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      :root[data-gi-theme='dark'] {
        --paper: #26362f;
        --grid: rgba(255, 255, 255, 0.04);
        --margin: transparent;
        --ink: #f1efe4;
        --x: #ffe28a;
        --o: #ff9fb3;
        --hl: rgba(255, 226, 138, 0.45);
        --muted: #a9b5ad;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      body {
        background-color: var(--paper);
        background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, transparent 56px, var(--margin) 56px, var(--margin) 58px, transparent 58px);
        background-size: 26px 26px, 26px 26px, 100% 100%;
        color: var(--ink);
        font: 700 22px/1.2 'Caveat', 'Comic Sans MS', cursive;
        display: grid;
        place-items: center;
      }
      :root[data-gi-theme='dark'] body {
        background-image: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.06), transparent 60%), radial-gradient(ellipse at 70% 80%, rgba(255, 255, 255, 0.04), transparent 55%);
        background-size: 100% 100%;
      }
      button, input { font: inherit; color: inherit; background: none; border: 0; }
      button { cursor: pointer; }
      [hidden] { display: none !important; }
      /* trazo de tiza: textura rugosa */
      :root[data-gi-theme='dark'] .stroke { filter: url(#chalk); }

      .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 60px 16px 20px; opacity: 0; visibility: hidden; transition: opacity 0.35s var(--ease), visibility 0s linear 0.35s; }
      .screen.on { opacity: 1; visibility: visible; transition: opacity 0.35s var(--ease); }
      .col { display: grid; gap: 12px; justify-items: center; width: min(360px, 100%); }
      h1 { font-size: 72px; line-height: 0.9; transform: rotate(-3deg); }
      h1 span { color: var(--o); }
      h1 b { color: var(--x); }
      .sub { color: var(--muted); font-size: 22px; margin-top: -4px; }
      .opt { position: relative; width: 100%; padding: 8px 16px; font-size: 30px; text-align: left; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .opt small { display: block; font-size: 19px; color: var(--muted); font-weight: 500; }
      .opt::after { content: ''; position: absolute; left: 12px; right: 30%; bottom: 4px; height: 10px; background: var(--hl); border-radius: 6px; transform: scaleX(0); transform-origin: left; transition: transform 0.4s var(--ease); z-index: -1; }
      .opt:hover { transform: translateX(6px) rotate(-1deg); }
      .opt:hover::after { transform: scaleX(1); }
      .pills { display: flex; gap: 10px; }
      .pill { padding: 2px 12px; font-size: 22px; border-bottom: 3px solid transparent; }
      .pill.on { border-color: var(--x); }
      .field { width: 100%; font-size: 30px; padding: 2px 6px; border-bottom: 2px dashed var(--ink); outline: none; -webkit-user-select: text; user-select: text; }
      .field.code { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; }
      .row { display: flex; gap: 14px; align-items: center; width: 100%; }
      .row > * { flex: 1; }
      .link { font-size: 26px; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
      .link:hover { color: var(--x); }
      .status { min-height: 1.2em; font-size: 22px; color: var(--o); text-align: center; }
      .back { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 22px; color: var(--muted); }
      .codebox { font-size: 54px; letter-spacing: 0.2em; color: var(--o); transform: rotate(-2deg); }
      .plist { list-style: none; width: 100%; font-size: 26px; }
      .plist li { display: flex; gap: 10px; align-items: baseline; }
      .plist li small { color: var(--muted); font-size: 18px; }

      /* juego */
      .game { display: grid; gap: 10px; justify-items: center; }
      .score { display: flex; gap: 22px; font-size: 26px; align-items: baseline; }
      .score .x { color: var(--x); }
      .score .o { color: var(--o); }
      .score small { color: var(--muted); font-size: 20px; }
      .score .turn { text-decoration: underline wavy; text-underline-offset: 6px; }
      #board { width: min(86vw, 62vh, 440px); height: min(86vw, 62vh, 440px); overflow: visible; touch-action: manipulation; }
      #board .hit { fill: transparent; cursor: pointer; }
      #board .hit:hover { fill: var(--hl); opacity: 0.35; }
      #board path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #board .g { stroke: var(--ink); stroke-width: 4; }
      #board .mx { stroke: var(--x); stroke-width: 7; }
      #board .mo { stroke: var(--o); stroke-width: 7; }
      #board .win { stroke: var(--hl); stroke-width: 26; opacity: 0.9; mix-blend-mode: multiply; }
      :root[data-gi-theme='dark'] #board .win { mix-blend-mode: normal; opacity: 0.8; }
      #board .draw { animation: draw var(--dur, 0.35s) var(--ease) forwards; animation-delay: var(--delay, 0s); }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      #board.erase { animation: erase 0.5s ease-in forwards; }
      @keyframes erase { to { opacity: 0; filter: blur(3px); transform: translateY(6px) rotate(-1deg); } }
      .msg { min-height: 1.3em; font-size: 32px; text-align: center; }
      .msg.pop { animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
      @keyframes pop { from { transform: scale(0.6) rotate(-6deg); opacity: 0; } }
      .timer { height: 4px; width: 160px; background: var(--grid); border-radius: 4px; overflow: hidden; }
      .timer i { display: block; height: 100%; background: var(--o); transform-origin: left; }
      .menu-btn { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); font-size: 22px; color: var(--muted); }
      :root[data-gi-motion='reduced'] * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <filter id="chalk"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" /><feDisplacementMap in="SourceGraphic" scale="3" /></filter>
    </svg>

    <section class="screen on" id="s-home">
      <div class="col">
        <h1><b>Ta</b>-<span>te</span>-<b>ti</b></h1>
        <p class="sub" data-t="tagline"></p>
        <button class="opt" data-go="cpu"><span data-t="vsCpu"></span><small data-t="vsCpuSub"></small></button>
        <button class="opt" data-go="local"><span data-t="local"></span><small data-t="localSub"></small></button>
        <button class="opt" data-go="online"><span data-t="online"></span><small data-t="onlineSub"></small></button>
      </div>
    </section>

    <section class="screen" id="s-cpu">
      <div class="col">
        <h2 data-t="vsCpu"></h2>
        <div class="pills" id="cpu-level"><button class="pill on" data-v="easy" data-t="easy"></button><button class="pill" data-v="hard" data-t="hard"></button></div>
        <button class="opt" id="cpu-start" style="text-align: center" data-t="play"></button>
      </div>
      <button class="back" data-go="home" data-t="back"></button>
    </section>

    <section class="screen" id="s-online">
      <div class="col">
        <h2 data-t="online"></h2>
        <input class="field" id="on-name" maxlength="16" autocomplete="off" />
        <button class="link" id="on-create" data-t="create"></button>
        <p class="sub" data-t="orJoin"></p>
        <div class="row"><input class="field code" id="on-code" maxlength="5" autocomplete="off" placeholder="ABCDE" /><button class="link" id="on-join" style="flex: 0" data-t="join"></button></div>
        <p class="status" id="on-status"></p>
      </div>
      <button class="back" data-go="home" data-t="back"></button>
    </section>

    <section class="screen" id="s-lobby">
      <div class="col">
        <p class="sub" data-t="shareCode"></p>
        <div class="codebox" id="lobby-code">-----</div>
        <button class="link" id="lobby-share" data-t="copyLink"></button>
        <ul class="plist" id="lobby-players"></ul>
        <button class="opt" id="lobby-start" style="text-align: center" data-t="start"></button>
        <p class="status" id="lobby-status"></p>
      </div>
      <button class="back" id="lobby-leave" data-t="leave"></button>
    </section>

    <section class="screen" id="s-game">
      <div class="game">
        <div class="score" id="score"></div>
        <svg id="board" viewBox="-10 -10 320 320"></svg>
        <div class="timer" id="timer" hidden><i></i></div>
        <p class="msg" id="msg"></p>
      </div>
      <button class="menu-btn" id="quit" data-t="quit"></button>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
